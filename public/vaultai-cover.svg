<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">VaultAI cover</title>
  <desc id="description">VaultAI local document intelligence with verified action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d" />
      <stop offset="1" stop-color="#183452" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203b5b" />
      <stop offset="1" stop-color="#142942" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9ab0c8" stroke-opacity="0.08" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#06101d" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)" />
  <rect width="1600" height="1000" fill="url(#grid)" />
  <circle cx="1310" cy="80" r="360" fill="#2dd4bf" opacity="0.08" />
  <circle cx="120" cy="900" r="260" fill="#2f7de1" opacity="0.08" />

  <g transform="translate(130 130)">
    <path d="M70 0 0 26v48c0 43 30 79 70 90 40-11 70-47 70-90V26L70 0Z" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-width="5" />
    <circle cx="70" cy="74" r="31" fill="none" stroke="#2dd4bf" stroke-width="8" />
    <circle cx="70" cy="74" r="8" fill="#2dd4bf" />
    <path d="M70 37v11M70 100v11M33 74h11M96 74h11" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" />
  </g>

  <text x="130" y="390" fill="#8ca2bb" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing="7">LOCAL-FIRST AI</text>
  <text x="130" y="500" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="100" font-weight="750" letter-spacing="-3">VaultAI</text>
  <text x="130" y="570" fill="#d8e5f2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38">Private documents.</text>
  <text x="130" y="620" fill="#2dd4bf" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700">Verified action.</text>

  <g transform="translate(840 120)" filter="url(#shadow)">

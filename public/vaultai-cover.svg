    <text x="46" y="66" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">DOCUMENT WORKSPACE</text>
    <rect x="46" y="102" width="518" height="92" rx="14" fill="#294969" />
    <circle cx="82" cy="148" r="18" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf" stroke-width="2" />
    <path d="M74 148h16M82 140v16" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
    <text x="116" y="140" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="650">Invoice_0142.pdf</text>
    <text x="116" y="169" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">Verified record · ready to review</text>

    <text x="46" y="250" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">EXTRACTED FIELDS</text>
    <rect x="46" y="278" width="244" height="84" rx="12" fill="#14263d" />
    <text x="70" y="313" fill="#8299b3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">TOTAL</text>
    <text x="70" y="343" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700">$1,240.00</text>
    <rect x="320" y="278" width="244" height="84" rx="12" fill="#14263d" />
    <text x="344" y="313" fill="#8299b3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">CONFIDENCE</text>
    <text x="344" y="343" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700">98.69%</text>

    <rect x="46" y="412" width="518" height="2" fill="#54718f" opacity="0.5" />
    <text x="46" y="470" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="650">Human review stays in control</text>
    <text x="46" y="515" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">Evidence-backed extraction</text>
    <text x="46" y="552" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">Local processing</text>
    <text x="46" y="589" fill="#9ab0c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">Auditable export</text>
    <rect x="46" y="630" width="160" height="38" rx="19" fill="#0f9480" />
    <text x="126" y="655" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">LOCAL ONLY</text>
